name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend packages
        run: npm ci

      - name: Unit tests
        run: cargo test -p dwbar-core

      - name: Build installer
        run: npx tauri build

      - name: Stable file names
        id: names
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName out/DW-Bar-Setup.exe
          Copy-Item (Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1).FullName out/DW-Bar.msi
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: DW-Bar-Windows
          if-no-files-found: error
          path: |
            out/DW-Bar-Setup.exe
            out/DW-Bar.msi

      # Every push to main publishes (or refreshes) the release for the current version.
      # The website's /download streams releases/latest/download/DW-Bar-Setup.exe.
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.names.outputs.version }}
          name: DW Bar ${{ steps.names.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            out/DW-Bar-Setup.exe
            out/DW-Bar.msi
