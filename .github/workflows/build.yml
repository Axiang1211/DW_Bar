name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact: win-x64
          - name: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
            artifact: win-arm64
          - name: macOS (Apple Silicon + Intel)
            os: macos-latest
            target: universal-apple-darwin
            bundles: dmg
            artifact: mac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.artifact }}

      - name: Install frontend packages
        run: npm ci

      - name: Unit tests
        if: matrix.artifact == 'win-x64'
        run: cargo test -p dwbar-core

      - name: Build
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Stable file names
        shell: bash
        run: |
          set -e
          mkdir -p out
          B="target/${{ matrix.target }}/release/bundle"
          case "${{ matrix.artifact }}" in
            win-x64)   cp "$(ls $B/nsis/*.exe | head -1)" out/DW-Bar-Setup.exe
                       cp "$(ls $B/msi/*.msi | head -1)"  out/DW-Bar.msi ;;
            win-arm64) cp "$(ls $B/nsis/*.exe | head -1)" out/DW-Bar-Setup-arm64.exe ;;
            mac)       cp "$(ls $B/dmg/*.dmg | head -1)"  out/DW-Bar.dmg ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: DW-Bar-${{ matrix.artifact }}
          if-no-files-found: error
          path: out/*

  # Every push to main publishes (or refreshes) the release for the current version.
  # The website's /download streams releases/latest/download/<file>.
  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Version
        id: v
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: DW Bar ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
