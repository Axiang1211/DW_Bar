name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Website-only changes are deployed by Cloudflare; no need to rebuild the app.
    paths-ignore: ["site/**", "**.md"]
  pull_request:
    paths-ignore: ["site/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact: win-x64
          - name: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
            artifact: win-arm64
          - name: macOS (Apple Silicon + Intel)
            os: macos-latest
            target: universal-apple-darwin
            bundles: dmg
            artifact: mac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.artifact }}

      - name: Install frontend packages
        run: npm ci

      - name: Unit tests
        if: matrix.artifact == 'win-x64'
        run: cargo test -p dwbar-core

      - name: Build
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Stable file names
        shell: bash
        run: |
          set -e
          mkdir -p out
          B="target/${{ matrix.target }}/release/bundle"
          case "${{ matrix.artifact }}" in
            win-x64)   cp "$(ls $B/nsis/*.exe | head -1)" out/DW-Bar-Setup.exe
                       cp "$(ls $B/msi/*.msi | head -1)"  out/DW-Bar.msi ;;
            win-arm64) cp "$(ls $B/nsis/*.exe | head -1)" out/DW-Bar-Setup-arm64.exe ;;
            mac)       cp "$(ls $B/dmg/*.dmg | head -1)"  out/DW-Bar.dmg ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: DW-Bar-${{ matrix.artifact }}
          if-no-files-found: error
          path: out/*

      # The bare executable, for the MSIX packages (not published on its own).
      - uses: actions/upload-artifact@v4
        if: startsWith(matrix.artifact, 'win-')
        with:
          name: exe-${{ matrix.artifact }}
          if-no-files-found: error
          path: target/${{ matrix.target }}/release/dw-bar.exe

  # Microsoft Store packages: one MSIX per architecture, bundled (unsigned; the Store signs
  # it), plus a test-signed copy and its certificate for installing before the Store does.
  msix:
    name: MSIX (Microsoft Store)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: exe-*
          path: exe
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version + ".0"
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64" | Sort-Object Name -Descending | Select-Object -First 1
          $makeappx = Join-Path $sdk.FullName "makeappx.exe"
          $makepri = Join-Path $sdk.FullName "makepri.exe"
          $signtool = Join-Path $sdk.FullName "signtool.exe"
          New-Item -ItemType Directory -Force out, bundle | Out-Null
          foreach ($arch in @("x64", "arm64")) {
            $layout = "layout-$arch"
            New-Item -ItemType Directory -Force $layout | Out-Null
            Copy-Item "exe/exe-win-$arch/dw-bar.exe" $layout
            Copy-Item -Recurse msix/Assets "$layout/Assets"
            (Get-Content msix/AppxManifest.xml -Raw).Replace("__VERSION__", $version).Replace("__ARCH__", $arch) |
              Set-Content "$layout/AppxManifest.xml" -Encoding utf8
            & $makepri createconfig /cf "priconfig-$arch.xml" /dq en-US /pv 10.0.0 /o
            & $makepri new /pr $layout /cf "priconfig-$arch.xml" /mn "$layout/AppxManifest.xml" /of "$layout/resources.pri" /o
            if ($LASTEXITCODE) { throw "makepri failed" }
            & $makeappx pack /d $layout /p "bundle/DW-Bar-$arch.msix" /o
            if ($LASTEXITCODE) { throw "makeappx pack failed" }
          }
          & $makeappx bundle /d bundle /p out/DW-Bar.msixbundle /bv $version /o
          if ($LASTEXITCODE) { throw "makeappx bundle failed" }

          # Test copy: self-signed with the Store publisher name, so it installs side by side
          # with nothing else changed. Trust DW-Bar-test.cer first (see the README).
          $publisher = ([xml](Get-Content msix/AppxManifest.xml)).Package.Identity.Publisher
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -FriendlyName "DW Bar test package" -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}") -NotAfter (Get-Date).AddYears(2)
          $pw = ConvertTo-SecureString -String "dwbar-test" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath test.pfx -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath out/DW-Bar-test.cer | Out-Null
          Copy-Item out/DW-Bar.msixbundle out/DW-Bar-test.msixbundle
          & $signtool sign /fd SHA256 /f test.pfx /p dwbar-test out/DW-Bar-test.msixbundle
          if ($LASTEXITCODE) { throw "signtool failed" }
          Get-ChildItem out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: DW-Bar-msix
          if-no-files-found: error
          path: out/*

  # A push to main publishes a release when the version in tauri.conf.json is new.
  # The website's /download streams releases/latest/download/<file>.
  release:
    name: Publish release
    needs: [build, msix]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: DW-Bar-*
          path: out
          merge-multiple: true
      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # A version is published once; bump the version to ship a new release.
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$V is already released; bump the version in tauri.conf.json to publish a new one."
          fi
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.exists != 'true'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: DW Bar ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
