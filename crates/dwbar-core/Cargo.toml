[package]
name = "dwbar-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "DW Bar core: taskbar placement, fullscreen detection, AI quota readers"

[features]
# Type-check the Win32 code on a non-Windows machine (cargo check only, never links).
lint-win = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# windows-sys is plain declarations, so it builds on any OS; the code that calls it
# is compiled only on Windows (or with `lint-win` for a Linux type-check).
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# WinRT StartupTask: start-at-login for the Microsoft Store (MSIX) package.
# Windows only: its async bindings don't build elsewhere (lint-win skips that module).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["ApplicationModel", "Foundation"] }
