[package]
name = "dw-bar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "DW Bar – AI quota capsule for the Windows taskbar"
default-run = "dw-bar"

[features]
# Type-check the Windows-only code paths on another OS (cargo check only).
lint-win = ["dwbar-core/lint-win"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
dwbar-core = { path = "../crates/dwbar-core" }
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
